<header id="title-block-header" class="default">
<div class="quarto-title">

<div class="post-kicker">
Note #<span class="post-number">00</span>$if(date)$ - $date$$endif$$if(categories)$$for(categories)$ $categories$$endfor$$endif$
</div>

$if(title)$
<h1 class="title post-title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle lead post-dek">$subtitle$</p>
$endif$

</div>

$if(hide-description)$
$elseif(description)$
<div>
  <p class="post-dek">
    $description$
  </p>
</div>
$endif$

</header>
