(() => {
  const root = document.documentElement;
  root.classList.add("page-entering");

  window.addEventListener("DOMContentLoaded", () => {
    window.setTimeout(() => {
      root.classList.remove("page-entering");
    }, 1250);
  }, { once: true });
})();
</script>
