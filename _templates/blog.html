<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geir's notes</title>
    <script>
    (() => {
        const root = document.documentElement;
        root.classList.add("page-entering");

        window.addEventListener("DOMContentLoaded", () => {
            window.setTimeout(() => {
                root.classList.remove("page-entering");
            }, 1250);
        }, { once: true });
    })();
    </script>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Geir's notes" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="stylesheet" href="/styles.css">

<script>
    document.addEventListener("DOMContentLoaded", function () {
        function getCategoryFromURL() {
            const hashParams = window.location.hash.match(/category=([^&]+)/);
            return hashParams ? decodeURIComponent(hashParams[1]) : null;
        }

        function filterListings() {
            const selected = getCategoryFromURL();
            document.querySelectorAll(".listing-row").forEach((row) => {
                const categories = (row.getAttribute("data-categories") || "").split(",").map((c) => c.trim());
                row.classList.toggle("is-hidden", Boolean(selected) && !categories.includes(selected));
            });
            document.querySelectorAll(".tag-link").forEach((link) => {
                link.classList.toggle("active", link.dataset.category === selected);
            });
        }

        window.addEventListener("hashchange", filterListings);
        filterListings();
    });
</script>

</head>
<body>

    <header class="site-header">
        <a href="/index.html" class="site-brand">
            <img src="/blog-logo.svg" alt="" class="site-logo">
            <span class="site-wordmark">geir's notes<span class="site-wordmark-cursor">_</span></span>
        </a>
        <nav class="site-nav">
            <a href="/about.html">about</a>
            <a href="/index.xml">rss</a>
        </nav>
    </header>

    <div class="hero-row">
        <div class="hero-blurb">
            $body$
        </div>
    </div>

    <div class="listing-wrap">
        <div id="blog-posts"></div>
    </div>

</body>
</html>
